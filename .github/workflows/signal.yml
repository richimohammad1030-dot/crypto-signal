name: Sinyal Crypto Futures

on:
  # Pemicu UTAMA: cron-job.org memanggil workflow_dispatch setiap 2 jam (menit 04, jam genap UTC).
  # Jadwal di bawah hanya CADANGAN jika cron-job.org gagal. Run ganda aman: bot berhenti sendiri
  # jika candle terakhir sudah diproses, jadi tidak ada pesan dobel.
  # Strategi dicek tiap 4 jam (03,07,11,15,19,23 WIB); run di antaranya melaporkan order terisi / posisi ditutup.
  workflow_dispatch: {}
  schedule:
    - cron: "34 */2 * * *"

permissions:
  contents: write         # menyimpan state.json (posisi & order yang sedang berjalan)

concurrency:
  group: crypto-state     # sama dengan "Perintah Telegram" (keduanya menulis state.json)
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Jalankan bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          MODAL_USDT: ${{ vars.MODAL_USDT }}
        run: python signal_bot.py
      - name: Simpan state
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json jurnal
          git diff --cached --quiet || git commit -m "update state $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q || true
          git push
