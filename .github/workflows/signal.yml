name: Sinyal Crypto Futures

on:
  schedule:
    # Setiap 4 jam, 7 menit setelah candle H1 close pada 03,07,11,15,19,23 WIB (UTC 20,0,4,8,12,16)
    - cron: "7 0,4,8,12,16,20 * * *"
  workflow_dispatch: {}   # tombol "Run workflow" untuk menjalankan manual

permissions:
  contents: write         # menyimpan state.json (posisi & order yang sedang berjalan)

concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Jalankan bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          MODAL_USDT: ${{ vars.MODAL_USDT }}
        run: python signal_bot.py
      - name: Simpan state
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state $(date -u +%Y-%m-%dT%H:%M)"
          git push
