name: Sinyal XAU Straddle

on:
  # Pemicu UTAMA: cron-job.org memanggil workflow_dispatch Senin-Jumat 07:09 s.d. 23:09 WIB tiap 2 jam.
  # Jadwal di bawah hanya CADANGAN jika cron-job.org gagal. Run ganda aman: bot hanya memproses
  # candle yang belum diproses, jadi tidak ada pesan dobel.
  workflow_dispatch: {}
  schedule:
    - cron: "39 0,2,4,6,8,10,12,14,16 * * 1-5"

permissions:
  contents: write

concurrency:
  group: gold-state          # terpisah dari crypto agar run XAU tidak saling membatalkan dengan run crypto
  cancel-in-progress: false

jobs:
  gold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Jalankan bot XAU
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          XAU_RISK_PCT: ${{ vars.XAU_RISK_PCT }}
        run: python gold_bot.py
      - name: Simpan state
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add gold_state.json
          git diff --cached --quiet || git commit -m "xau state $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q || true
          git push
