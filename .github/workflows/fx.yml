name: Sinyal FX Major

# Bot FX MAJOR (pemilik, 20 Nov 2026): 7 pair, UTAMA 07:00 WIB + SUSULAN 15:00 WIB + LANJUT setelah TP, tutup 23:00 WIB.
# Jalan tiap jam Senin-Jumat 07:39 s.d. 23:39 WIB. Pemicu tambahan (lebih tepat waktu) boleh dari cron-job.org via
# workflow_dispatch. Run ganda aman: kejadian yang sudah dikirim dicatat di fx_state.json.
# Tujuan pesan: variabel repo FX_TUJUAN=kanal -> channel XAU; kosong -> chat pribadi pemilik (uji maju).
on:
  workflow_dispatch: {}
  schedule:
    - cron: "39 0-16 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fx-state
  cancel-in-progress: false

jobs:
  fx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang pustaka
        run: pip install -q numpy
      - name: Jalankan bot FX
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FX_RISK_PCT: ${{ vars.FX_RISK_PCT }}
          FX_TUJUAN: ${{ vars.FX_TUJUAN }}
        run: python fx_bot.py
      - name: Simpan state
        if: always()
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add fx_state.json
          git diff --cached --quiet || git commit -m "fx state $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 10 + 3)); done
