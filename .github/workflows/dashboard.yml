name: Dashboard Monitoring

# Pemilik, 24 Nov 2026: dashboard realtime pekerjaan riset (GitHub Pages). Dibangun ulang tiap 30 menit dan setelah
# rutinitas harian, saringan massal, dan penyalinan laporan riset. Sumber: riset/dashboard/bangun.py + docs/index.html.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_run:
    workflows: ["Saringan Massal Malam", "Rutinitas Harian Riset", "Kirim Laporan Riset"]
    types: [completed]
  push:
    branches: [main]
    paths: ["riset/**", "docs/index.html"]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bangun:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bangun data
        run: python riset/dashboard/bangun.py . _site
      - name: Simpan data.json ke repo (dibaca halaman Netlify lewat raw.githubusercontent)
        run: |
          cp _site/data.json docs/data.json
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -q -m "dashboard data $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      # GitHub Pages opsional (aktif bila pemilik menyalakan Settings > Pages > GitHub Actions)
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
