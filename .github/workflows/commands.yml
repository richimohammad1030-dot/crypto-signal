name: Perintah Telegram

on:
  # Tidak terjadwal: perintah Telegram sudah dibaca oleh workflow "Sinyal Crypto Futures" setiap 2 jam.
  # Jalankan manual (Run workflow) jika ingin perintah diproses segera.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: signal-bot        # sama dengan workflow sinyal agar state.json tidak bentrok
  cancel-in-progress: false

jobs:
  cmd:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Proses perintah
        env:
          MODE: cmd
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signal_bot.py
      - name: Simpan state
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "perintah $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q || true
          git push
